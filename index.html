<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteTide · 字节潮</title>
    <script>
      // 在 CSS 加载前根据持久化主题设置 data-theme，避免首屏主题闪烁
      // 默认浅色（白）；仅当显式存过 dark 才用深色。
      // 值两种形状（与 useTheme 的信封迁移一致）：v1 信封 {schema:'theme',version:1,data}
      // 与旧版裸字符串 'dark'/'light'。
      (function () {
        var mode = 'light';
        try {
          var t = localStorage.getItem('serialtool.theme');
          if (t === 'dark' || t === 'light') {
            mode = t;
          } else if (t && t.charAt(0) === '{') {
            var v = JSON.parse(t);
            if (v && v.schema === 'theme' && v.version === 1 && (v.data === 'dark' || v.data === 'light')) {
              mode = v.data;
            }
          }
        } catch (e) { /* 坏值回默认浅色 */ }
        document.documentElement.dataset.theme = mode;
      })();
    </script>
    <style>
      html[data-theme='light'] body { background: #f1f5f9; margin: 0; }
      html:not([data-theme='light']) body { background: #0b1220; margin: 0; }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
