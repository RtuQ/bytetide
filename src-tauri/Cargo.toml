[package]
name = "serial_tool"
version = "0.1.0"
description = "ByteTide (字节潮) — a dark, data-dense desktop serial/UART debug and protocol analysis tool with binary frame decoding, waveform plotting, and a REST analysis bridge for AI agents."
authors = ["Howe"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "serial_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 串口与异步
serialport = "4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "fs"] }
# REST 桥 /export 文件流式响应（ReaderStream）
tokio-util = { version = "0.7", features = ["io"] }
parking_lot = "0.12"
once_cell = "1"
anyhow = "1"
# 时间戳
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 单实例
single-instance = "0.3"
# REST 分析桥（进程内 axum server + 正则过滤 + 帧解码）
axum = "0.7"
regex = "1"
tauri-plugin-notification = "2"

# Windows：退出 EcoQoS 能效限流（后台/锁屏时系统会把进程丢进节能队列，
# 导致 IPC 派发延迟数十秒——长挂监控必须显式禁用）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

