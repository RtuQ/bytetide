name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 工作区化后 cargo 在仓库根执行，缓存默认即根 workspace / target
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Rust：单元测试 + 编译检查（覆盖 bytetide-core / bytetide-cli / src-tauri 全工作区）
      - name: Rust tests
        run: cargo test --workspace

      - name: Rust check
        run: cargo check --workspace

      # 前端：类型检查 + 构建
      - name: Install JS deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test
