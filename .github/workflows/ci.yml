name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 工作区化后 cargo 在仓库根执行，缓存默认即根 workspace / target
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 版本一致性预检：四份清单必须同版本
      - name: Release version check
        run: npm run check:version

      # Tauri 配置预检：Windows 后台节流 flag 必须齐全且为独立参数
      - name: Tauri config check
        run: npm run check:tauri-config

      # 架构红线：core 纯净性 + IPC 边界 + 文件行数限额
      - name: Architecture check
        run: npm run check:architecture

      # Rust：单元测试 + 编译检查（覆盖 bytetide-core / bytetide-cli / src-tauri 全工作区）
      - name: Rust tests
        run: cargo test --workspace

      # REST 桥路由层集成测试（fake service + oneshot 直喂 Router，不含真实串口/网络）
      - name: Bridge route tests
        run: cargo test -p serial_tool --test bridge_routes

      - name: Rust check
        run: cargo check --workspace

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 前端：类型检查 + 构建
      - name: Install JS deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test
